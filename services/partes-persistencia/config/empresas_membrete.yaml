# config/empresas_membrete.yaml
# F-023 (DA3): alias del MEMBRETE del parte por empresa de Sigrid.
#
# sv2 copia tal cual el nombre de empresa impreso en el membrete o el
# logotipo; sv3 lo traduce con esta tabla. Clave: numemp de auxemp (el
# numero que usa con.emp). Valor: lista de alias. Casa si el texto
# normalizado (minusculas, sin acentos ni signos) contiene un alias como
# palabras completas, y solo si es de UNA empresa valida.
#
# La mantiene el humano: un alias nuevo es un cambio versionado.
1:
  - RUESMA
  # F-029: el logotipo impreso es «ruΞsma» (Xi griega por la E). La
  # normalizacion convierte toda letra no latina en espacio, asi que el
  # logotipo (y la variante «ru≡sma») queda «ru sma» y no casa con
  # RUESMA. Este alias normaliza igual: «ru sma».
  - RUΞSMA
28:
  - PORSAN
